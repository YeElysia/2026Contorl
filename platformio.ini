[platformio]
default_envs = genericSTM32H750VB

; custom common options
[env]
platform = ststm32
board = genericSTM32H750VB
framework = arduino
upload_protocol = cmsis-dap
debug_tool = cmsis-dap
upload_speed = 256000 
monitor_speed = 115200
build_flags =
    -I include

[env:genericSTM32H750VB]
build_src_filter = +<main.cpp>

; 机械臂独立测试：不初始化底盘、IMU、扫码器、屏幕和MaixPro。
[env:mechanism_test]
build_src_filter = +<mechanism_test.cpp>
