[platformio]
default_envs = genericSTM32H750VB

; custom common options
[env]
platform = ststm32
board = genericSTM32H750VB
framework = arduino
upload_protocol = cmsis-dap
debug_tool = cmsis-dap
upload_speed = 256000 
monitor_speed = 115200
; newlib-nano默认不支持%f，否则日志里的浮点数全部为空。
build_flags =
    -I include
    -Wl,-u,_printf_float

[env:genericSTM32H750VB]
build_src_filter = +<main.cpp>

; 机械臂独立测试：不初始化底盘、IMU、扫码器、屏幕和MaixPro。
[env:mechanism_test]
build_src_filter = +<mechanism_test.cpp>

[env:turntable_grasp_test]
build_src_filter = +<turntable_grasp_test.cpp>

[env:first_layer_placement_test]
build_src_filter = +<first_layer_placement_test.cpp>
build_flags =
    ${env.build_flags}
    -DFIRST_LAYER_PLACEMENT_TEST

; 储料盘向粗加工圆环放料速度/加速度标定。
[env:rough_placement_calibration_test]
build_src_filter = +<rough_placement_calibration_test.cpp>

; 粗加工圆环向储料盘2770回程速度/加速度标定。
[env:rough_return_calibration_test]
build_src_filter = +<rough_return_calibration_test.cpp>

; 物料放回载物盘测试：运行时调整料槽角度、底座、伸缩和下降高度，验证放回位置。
[env:tray_putback_test]
build_src_filter = +<tray_putback_test.cpp>

; 圆环对齐独立测试：PB9启动，机构先进入粗加工识别准备位。
[env:ring_alignment_test]
build_src_filter = +<ring_alignment_test.cpp>

; 底盘长直线隔离测试：不初始化机械臂、相机、扫码器和串口屏。
[env:chassis_straight_test]
build_src_filter = +<chassis_straight_test.cpp>

; 底盘四方向距离标定测试：单独测量前后左右四个方向的精度和航向偏移。
[env:distance_calibration_test]
build_src_filter = +<distance_calibration_test.cpp>

; 完整路线测试：只跑底盘，调试串口发送'n'后按比赛两轮顺序一次跑完全程。
[env:full_route_test]
build_src_filter = +<full_route_test.cpp>

; 同上，但从右上启停区(185,2250)起步，用于复现右上发车的旋转/乱动问题。
[env:full_route_test_upper]
extends = env:full_route_test
build_flags =
    ${env.build_flags}
    -DROUTE_TEST_UPPER_RIGHT

; EMM42 V5 TTL反馈测试：验证电机地址和通信状态。
[env:emm42_ttl_test]
build_src_filter = +<emm42_ttl_test.cpp>

; Mechanical arm EMM42 TTL feedback probe: read-only status queries for IDs 7, 6, and 5.
[env:mechanism_ttl_feedback_test]
build_src_filter = +<mechanism_ttl_feedback_test.cpp>

; 机械臂小幅度调用测试：按主程序的指令接口和轮询方式让升降、伸缩、基座做几毫米往返。
[env:mechanism_small_move_test]
build_src_filter = +<mechanism_small_move_test.cpp>

; 同一个测试，行程改为主流程实际用到的大行程（基座转180度、伸缩到EXTENSION_HOME、升降到LIFT_TURNTABLE）。
[env:mechanism_full_range_test]
extends = env:mechanism_small_move_test
build_flags =
    ${env.build_flags}
    -DSMALL_MOVE_FULL_RANGE

; 全行程测试，只动基座（升降照常），用于判断是否基座大行程动作引起。
[env:mechanism_full_range_base_only]
extends = env:mechanism_full_range_test
build_flags =
    ${env:mechanism_full_range_test.build_flags}
    -DSMALL_MOVE_ONLY_BASE

; 全行程测试，只动伸缩（升降照常）。
[env:mechanism_full_range_ext_only]
extends = env:mechanism_full_range_test
build_flags =
    ${env:mechanism_full_range_test.build_flags}
    -DSMALL_MOVE_ONLY_EXT

                                         
[env:test_screen_debug]                                                                     
build_src_filter = +<test_screen_debug.cpp>   
