[platformio]
default_envs = genericSTM32H750VB

; custom common options
[env]
platform = ststm32
board = genericSTM32H750VB
framework = arduino
upload_protocol = cmsis-dap
debug_tool = cmsis-dap
upload_speed = 256000 
monitor_speed = 115200
build_flags =
    -I include

[env:genericSTM32H750VB]
build_src_filter = +<main.cpp>

; 机械臂独立测试：不初始化底盘、IMU、扫码器、屏幕和MaixPro。
[env:mechanism_test]
build_src_filter = +<mechanism_test.cpp>

; 储料盘向粗加工圆环放料速度/加速度标定。
[env:rough_placement_calibration_test]
build_src_filter = +<rough_placement_calibration_test.cpp>

; 粗加工圆环向储料盘2770回程速度/加速度标定。
[env:rough_return_calibration_test]
build_src_filter = +<rough_return_calibration_test.cpp>

; 圆环对齐独立测试：PB9启动，机构先进入粗加工识别准备位。
[env:ring_alignment_test]
build_src_filter = +<ring_alignment_test.cpp>

; 底盘长直线隔离测试：不初始化机械臂、相机、扫码器和串口屏。
[env:chassis_straight_test]
build_src_filter = +<chassis_straight_test.cpp>

; 底盘四方向距离标定测试：单独测量前后左右四个方向的精度和航向偏移。
[env:distance_calibration_test]
build_src_filter = +<distance_calibration_test.cpp>

; EMM42 V5 TTL反馈测试：验证电机地址和通信状态。
[env:emm42_ttl_test]
build_src_filter = +<emm42_ttl_test.cpp>

; Mechanical arm EMM42 TTL feedback probe: read-only status queries for IDs 7, 6, and 5.
[env:mechanism_ttl_feedback_test]
build_src_filter = +<mechanism_ttl_feedback_test.cpp>

                                         
[env:test_screen_debug]                                                                     
build_src_filter = +<test_screen_debug.cpp>   
